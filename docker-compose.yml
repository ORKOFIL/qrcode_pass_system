version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: qrcode_pass_system
    restart: always
    environment:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
      POSTGRES_DB: qrcode_pass_system
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: